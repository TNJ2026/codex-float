name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: codex-float-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: codex-float-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: codex-float-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.artifact }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm test
      - run: npm run build
      - name: Rust static checks
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native tests (no live Codex session required)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows app and installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: npm run build:macos -- --bundles dmg
      - name: Package Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/codex-float.exe -Destination artifacts/CodexFloat-windows-x64.exe
          Compress-Archive -LiteralPath artifacts/CodexFloat-windows-x64.exe -DestinationPath artifacts/CodexFloat-windows-x64-portable.zip
          Remove-Item -LiteralPath artifacts/CodexFloat-windows-x64.exe
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item -LiteralPath $installer.FullName -Destination artifacts/CodexFloat-windows-x64-setup.exe
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" "artifacts/${{ matrix.artifact }}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            CodexFloat-windows-x64-portable.zip
            CodexFloat-windows-x64-setup.exe
            codex-float-macos-arm64.dmg
            codex-float-macos-x64.dmg
          )
          for file in "${expected[@]}"; do test -s "artifacts/$file"; done
          (cd artifacts && sha256sum "${expected[@]}" > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
            --title "CodexFloat $RELEASE_TAG" --notes-file .github/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
