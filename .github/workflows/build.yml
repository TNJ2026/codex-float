name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: codex-float-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: codex-float-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: codex-float-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native tests (no live Codex session required)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle
      - name: Build experimental macOS app
        if: runner.os == 'macOS'
        run: npm run build:macos -- --bundles app
      - name: Preserve macOS app permissions in an archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Codex Float.app" "artifacts/${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/codex-float.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error
